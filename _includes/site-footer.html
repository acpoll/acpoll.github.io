<footer class="site-footer">
  <div class="shell site-footer__inner">
    <p>© {{ site.time | date: '%Y' }} {{ site.data.profile.name }}</p>
    <div class="footer-links" aria-label="Profile links">
      {% for profile in site.data.profile.profiles %}
        <a href="{{ profile.url }}" rel="me">{{ profile.label }}</a>
      {% endfor %}
    </div>
  </div>
</footer>
