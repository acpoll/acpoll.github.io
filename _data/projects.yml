- id: robotic-hand
  order: 70
  title: Construction of a Robotic Hand and Application of Imitation Learning
  label: Real-World Robotics class
  status: Previous
  featured: true
  summary:
    - Hardware design of a robotic hand based on a design provided by the Soft Robotics Lab at ETH Zurich.
    - Teleoperation with the hand mounted on a Franka Emika robotic arm and imitation learning for autonomous cube sorting.
    - Low-cost, high-sensitivity pressure sensors using Force Sensitive Resistors and an Action Chunking Transformer policy.
  images:
    - src: https://i.ytimg.com/vi/ouuZPDAGm2Y/maxresdefault.jpg
      alt: YouTube thumbnail of the robotic hand performing a cube-sorting task
      external: true
      link: https://youtube.com/shorts/ouuZPDAGm2Y?feature=share
      youtube_id: ouuZPDAGm2Y
  links:
    - label: Demo video
      url: https://youtube.com/shorts/ouuZPDAGm2Y?feature=share

